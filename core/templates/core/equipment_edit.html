{% extends 'base.html' %}
{% block title %}编辑设备 - {{ equipment.name }}{% endblock %}

{% block content %}
<div class="container py-5">
    <h2 class="mb-4">✏️ 编辑设备</h2>

    <form method="post">
        {% csrf_token %}

        <div class="row">
            <div class="col-md-6">
                <label>设备编号</label>
                <input type="text" name="code" class="form-control" value="{{ equipment.code }}" readonly>
            </div>
            <div class="col-md-6">
                <label>设备名称 <span class="text-danger">*</span></label>
                <input type="text" name="name" class="form-control" value="{{ equipment.name }}" required>
            </div>
        </div>

        <div class="row mt-3">
            <div class="col-md-4">
                <label>站别</label>
                <input type="text" name="station" class="form-control" value="{{ equipment.station|default:'' }}">
            </div>
            <div class="col-md-4">
                <label>线别</label>
                <input type="text" name="line" class="form-control" value="{{ equipment.line|default:'' }}">
            </div>
            <div class="col-md-4">
                <label>RFID卡号</label>
                <input type="text" name="rfid_card" class="form-control" value="{{ equipment.rfid_card|default:'' }}">
            </div>
        </div>

        <div class="row mt-3">
            <div class="col-md-6">
                <label>区域</label>
                <input type="text" name="area" class="form-control" value="{{ equipment.area|default:'' }}">
            </div>
            <div class="col-md-6">
                <label>设备类型</label>
                <input type="text" name="eq_type" class="form-control" value="{{ equipment.eq_type|default:'' }}">
            </div>
        </div>

        <div class="mt-4">
            <button type="submit" class="btn btn-warning">✅ 保存修改</button>
            <a href="{% url 'core:equipment_list' %}" class="btn btn-secondary">返回列表</a>
        </div>
    </form>
</div>
{% endblock %}
