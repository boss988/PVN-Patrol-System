{% extends 'base.html' %}
{% block title %}编辑设备 - {{ equipment.name }}{% endblock %}

{% block content %}
<div class="container-fluid px-3 mt-3" style="max-width: 960px;">
    <h3 class="mb-3">✏️ 编辑设备Chỉnh sửa thiết bị</h3>

    <form method="post">
        {% csrf_token %}

        <!-- 基本信息 -->
        <div class="card mb-3 shadow-sm">
            <div class="card-header fw-bold">基本信息Thông tin cơ bản</div>
            <div class="card-body">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">设备编号Mã thiết bị</label>
                        <input type="text" name="code" class="form-control" value="{{ equipment.code }}" readonly>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">设备名称Tên thiết bị <span class="text-danger">*</span></label>
                        <input type="text" name="name" class="form-control" value="{{ equipment.name }}" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">RFID卡号</label>
                        <input type="text" name="rfid_card" class="form-control" value="{{ equipment.rfid_card|default:'' }}">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">设备类型Loại thiết bị</label>
                        <input type="text" name="eq_type" class="form-control" value="{{ equipment.eq_type|default:'' }}" placeholder="如：自动锁螺丝机">
                    </div>
                </div>
            </div>
        </div>

        <!-- 位置：机种 → 类别 → 线别 → 站别 -->
        <div class="card mb-3 shadow-sm">
            <div class="card-header fw-bold">设备位置Vị trí thiết bị</div>
            <div class="card-body">
                <div class="row g-3">
                    <div class="col-md-3">
                        <label class="form-label">机种Loại máy</label>
                        <select name="model_type" id="modelType" class="form-select">
                            <option value="">-- 请选择机种 --</option>
                            {% for mt in model_types %}
                            <option value="{{ mt }}" {% if equipment.model_type == mt %}selected{% endif %}>{{ mt }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">类别Loại</label>
                        <select name="category" id="categorySelect" class="form-select">
                            <option value="">-- 先选机种 --</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">线别Tuyến</label>
                        <select name="line" id="lineSelect" class="form-select">
                            <option value="">-- 先选类别 --</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">站别Trạm</label>
                        <input type="text" name="station" class="form-control" value="{{ equipment.station|default:'' }}" placeholder="如：D52">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">区域Khu vực</label>
                        <input type="text" name="area" class="form-control" value="{{ equipment.area|default:'' }}">
                    </div>
                </div>
            </div>
        </div>

        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-warning">✅ 保存修改Lưu</button>
            <a href="{% url 'core:equipment_list' %}" class="btn btn-outline-secondary">返回列表</a>
        </div>
    </form>
</div>

<script>
const CONFIGS = {{ configs_json|safe }};
const CURRENT_CATEGORY = "{{ equipment.category|default:''|escapejs }}";
const CURRENT_LINE = "{{ equipment.line|default:''|escapejs }}";

const modelTypeEl = document.getElementById('modelType');
const categoryEl = document.getElementById('categorySelect');
const lineEl = document.getElementById('lineSelect');

function resetSelect(el, text) {
    el.innerHTML = '<option value="">' + text + '</option>';
}

function fillCategories(mt, selectedCat) {
    resetSelect(categoryEl, '-- 请选择类别 --');
    resetSelect(lineEl, '-- 先选类别 --');
    if (!mt) return;
    const cats = [];
    CONFIGS.forEach(function (c) {
        if (c.model_type === mt && c.category && cats.indexOf(c.category) === -1) {
            cats.push(c.category);
        }
    });
    cats.forEach(function (cat) {
        const opt = document.createElement('option');
        opt.value = cat;
        opt.textContent = cat;
        if (selectedCat && cat === selectedCat) opt.selected = true;
        categoryEl.appendChild(opt);
    });
}

function fillLines(mt, cat, selectedLine) {
    resetSelect(lineEl, '-- 请选择线体 --');
    if (!mt || !cat) return;
    CONFIGS.forEach(function (c) {
        if (c.model_type === mt && c.category === cat) {
            const opt = document.createElement('option');
            opt.value = c.line;
            opt.textContent = c.line;
            if (selectedLine && c.line === selectedLine) opt.selected = true;
            lineEl.appendChild(opt);
        }
    });
}

modelTypeEl.addEventListener('change', function () {
    fillCategories(this.value, '');
});

categoryEl.addEventListener('change', function () {
    fillLines(modelTypeEl.value, this.value, '');
});

// 打开编辑页时回填类别、线别
(function () {
    const mt = modelTypeEl.value;
    if (mt) {
        fillCategories(mt, CURRENT_CATEGORY);
        if (CURRENT_CATEGORY) {
            fillLines(mt, CURRENT_CATEGORY, CURRENT_LINE);
        }
    }
})();
</script>
{% endblock %}
