{% extends 'base.html' %}
{% block title %}新建设备{% endblock %}
{% block content %}
<h2>新建设备Thêm mới thiết bị</h2>

<form method="post">
    {% csrf_token %}
    <div class="row">
        <div class="col-md-6">
            <label>设备编号 <span class="text-danger">*</span></label>
            <input type="text" name="code" class="form-control" required>
        </div>
        <div class="col-md-6">
            <label>设备名称Số hiệu thiết bị <span class="text-danger">*</span></label>
            <input type="text" name="name" class="form-control" required>
        </div>
    </div>

    <div class="row mt-3">
        <div class="col-md-6">
            <label>安装日期Ngày lắp đặt <span class="text-danger">*</span></label>
            <input type="date" name="install_date" class="form-control" required>
        </div>
        <div class="col-md-6">
            <label>状态Trạng thái</label>
            <select name="status" class="form-control">
                <option value="active">活跃Hoạt động</option>
                <option value="inactive">停用Ngừng hoạt động</option>
                <option value="maintenance">保养中Đang bảo dưỡng</option>
            </select>
        </div>
    </div>

    <!-- RFID 改为必填 -->
    <div class="row mt-3">
        <div class="col-md-4">
            <label>RFID卡号 <span class="text-danger">*</span></label>
            <input type="text" name="rfid_card" class="form-control" required>
        </div>
        <div class="col-md-4">
            <label>站别Trạm</label>
            <input type="text" name="station" class="form-control">
        </div>
        <div class="col-md-4">
            <label>线别Dây chuyền</label>
            <input type="text" name="line" class="form-control">
        </div>
    </div>

    <div class="row mt-3">
        <div class="col-md-6">
            <label>机种Loại máy</label>
            <input type="text" name="model_type" class="form-control">
        </div>
        <div class="col-md-6">
            <label>区域Khu vực</label>
            <input type="text" name="area" class="form-control">
        </div>
    </div>

    <div class="row mt-3">
        <div class="col-md-6">
            <label>类别Loại</label>
            <input type="text" name="category" class="form-control">
        </div>
        <div class="col-md-6">
            <label>设备类型Loại thiết bị</label>
            <input type="text" name="eq_type" class="form-control" placeholder="如：自动锁螺丝机">
        </div>
    </div>

    <div class="mt-4">
        <button type="submit" class="btn btn-success">✅ 保存设备Lưu thiết bị</button>
    </div>
</form>
{% endblock %}
