{% extends 'base.html' %}
{% block title %}新建用户{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-header bg-primary text-white text-center">
                    <h4>➕ 新建用户</h4>
                </div>
                <div class="card-body">
                    <form method="post">
                        {% csrf_token %}

                        <div class="mb-3">
                            <label class="form-label">工号（登录账号）</label>
                            <input type="text" name="username" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">姓名</label>
                            <input type="text" name="name" class="form-control">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">密码</label>
                            <input type="password" name="password" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">职能 / 部门</label>
                            <input type="text" name="department" class="form-control">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">权限领域</label>
                            <input type="text" name="permission_area" class="form-control">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">用户角色</label>
                            <select name="role" class="form-select">
                                <option value="user">普通用户</option>
                                <option value="admin">管理员</option>
                            </select>
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-success">保存用户</button>
                            <a href="{% url 'users:user_list' %}" class="btn btn-secondary">取消</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
