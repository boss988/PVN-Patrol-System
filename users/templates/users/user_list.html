{% extends 'base.html' %}
{% block title %}用户管理{% endblock %}

{% block content %}
<div class="container mt-4">
    <h2>👥 用户管理</h2>

    <a href="{% url 'users:user_create' %}" class="btn btn-primary mb-3">
        ➕ 新建用户
    </a>

    <table class="table table-striped table-hover">
        <thead class="table-dark">
            <tr>
                <th>工号</th>
                <th>姓名</th>
                <th>角色</th>
                <th>操作</th>
            </tr>
        </thead>
        <tbody>
            {% for u in users %}
            <tr>
                <td><strong>{{ u.username }}</strong></td>
                <td>{{ u.profile.name|default:'-' }}</td>
                <td>
                    <span class="badge {% if u.profile.role == 'admin' %}bg-danger{% else %}bg-secondary{% endif %}">
                        {{ u.profile.get_role_display }}
                    </span>
                </td>
                <td>
                    <a href="{% url 'users:user_edit' u.pk %}" class="btn btn-warning btn-sm">编辑</a>
                    <a href="{% url 'users:user_delete' u.pk %}"
                       class="btn btn-danger btn-sm"
                       onclick="return confirm('确定删除用户 {{ u.username }} 吗？此操作不可恢复！')">
                        删除
                    </a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
