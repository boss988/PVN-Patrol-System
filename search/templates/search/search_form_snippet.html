<!-- search_form_snippet.html - 恢复最初版本 -->
<div class="mb-3 border p-3 bg-light rounded">
    <h5>🔍 先搜索并选中设备（RFID扫码优先）</h5>
    <form method="get">
        <div class="row g-3">
            <div class="col-md-2"><label>ID</label>{{ form.id_search }}</div>
            <div class="col-md-2"><label>设备名称</label>{{ form.name }}</div>
            <div class="col-md-2"><label>厂别</label>{{ form.area }}</div>
            <div class="col-md-2"><label>线别</label>{{ form.line }}</div>
            <div class="col-md-2"><label>机种名称</label>{{ form.model_type }}</div>
            <div class="col-md-2"><label>设备状态</label>{{ form.status }}</div>
            <div class="col-md-2"><label>站别</label>{{ form.station }}</div>
            <div class="col-md-2 mt-4">
                <button type="submit" class="btn btn-primary w-100">🔍 搜索设备</button>
            </div>
        </div>
    </form>
</div>
