{% extends 'base.html' %}
{% block title %}手动添加KPI{% endblock %}
{% block content %}
<h2>手动添加KPI数据</h2>

<form method="post">
    {% csrf_token %}
    <div class="mb-3">
        <label>设备</label>
        <select name="equipment" class="form-control" required>
            {% for e in equipments %}
            <option value="{{ e.id }}">{{ e.name }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="mb-3">
        <label>MTBF (小时)</label>
        <input type="number" step="0.1" name="mtbf" class="form-control" value="100" required>
    </div>
    <div class="mb-3">
        <label>MTTR (小时)</label>
        <input type="number" step="0.1" name="mttr" class="form-control" value="2" required>
    </div>
    <div class="mb-3">
        <label>OEE (%)</label>
        <input type="number" step="0.1" name="oee" class="form-control" value="85" required>
    </div>
    <button type="submit" class="btn btn-success">✅ 保存KPI</button>
</form>
{% endblock %}
