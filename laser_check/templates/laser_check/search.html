{% extends 'base.html' %}
{% load static %}

{% block title %}镭雕图检查工具{% endblock %}

{% block content %}
<div class="container mt-4">
    <h2>🔍 镭雕图检查工具</h2>
    <p class="text-muted">输入料号，快速查找产品图和镭雕图进行对比</p>

    <form method="post" action="{% url 'laser_check:search_page' %}">
        {% csrf_token %}
        <div class="input-group mb-3" style="max-width: 600px;">
            <input type="text"
                   name="part_number"
                   class="form-control form-control-lg"
                   placeholder="请输入料号，例如 SXNL-5QL0012"
                   value="{{ request.POST.part_number|default:'' }}"
                   required>
            <button class="btn btn-primary btn-lg" type="submit">搜索</button>
        </div>
    </form>

    <a href="{% url 'laser_check:settings_page' %}" class="btn btn-outline-secondary">
        ⚙️ 设置文件夹路径
    </a>
</div>
{% endblock %}
