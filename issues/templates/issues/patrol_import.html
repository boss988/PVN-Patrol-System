{% extends 'base.html' %}
{% block title %}导入点检问题Excel{% endblock %}
{% block content %}
<h2>📤 导入点检问题记录（问题要改善12.xlsx）</h2>

{% if messages %}
    {% for message in messages %}
    <div class="alert alert-{{ message.tags }}">{{ message }}</div>
    {% endfor %}
{% endif %}

<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    <div class="mb-3">
        <label class="form-label">选择Excel文件</label>
        <input type="file" name="excel_file" class="form-control" accept=".xlsx" required>
    </div>
    <button type="submit" class="btn btn-success">🚀 开始导入</button>
    <a href="{% url 'issues:patrol_list' %}" class="btn btn-secondary">返回列表</a>
</form>

<p class="text-muted mt-3">
    支持文件：<strong>Copy of 问题要改善12.xlsx</strong><br>
    自动读取“问题记录 2026”工作表
</p>
{% endblock %}
