{% extends 'base.html' %}
{% block title %}编辑异常Sửa bất thường - {{ issue.issue_code }}{% endblock %}

{% block content %}
<div class="container mt-4" style="max-width: 900px;">
    <h3 class="mb-3">✏️ 编辑设备异常Sửa bất thường thiết bị</h3>
    <p class="text-muted">问题码：{{ issue.issue_code }}　|　设备：{{ issue.equipment.code }} - {{ issue.equipment.name }}</p>

    <form method="post">
        {% csrf_token %}

        <div class="card mb-3">
            <div class="card-header fw-bold">基本信息</div>
            <div class="card-body">
                <div class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label">发生日期Ngày</label>
                        <input type="date" name="occur_date" class="form-control"
                               value="{{ issue.occur_date|date:'Y-m-d' }}">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">异常工时(分钟)</label>
                        <input type="number" name="abnormal_work_time" class="form-control" min="0"
                               value="{{ issue.abnormal_work_time }}">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">严重度</label>
                        <select name="severity" class="form-select">
                            <option value="1" {% if issue.severity == 1 %}selected{% endif %}>低</option>
                            <option value="2" {% if issue.severity == 2 %}selected{% endif %}>中</option>
                            <option value="3" {% if issue.severity == 3 %}selected{% endif %}>高</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">问题类别Loại vấn đề</label>
                        <select name="category" class="form-select">
                            <option value="">-- 请选择 --</option>
                            {% for c in categories %}
                            <option value="{{ c.id }}" {% if issue.category_id == c.id %}selected{% endif %}>{{ c.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">责任主管Chủ quản</label>
                        <select name="supervisor" class="form-select">
                            <option value="">-- 请选择 --</option>
                            {% for s in supervisor_choices %}
                            <option value="{{ s }}" {% if issue.supervisor == s %}selected{% endif %}>{{ s }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-12">
                        <label class="form-label">异常现象及原因</label>
                        <textarea name="desc" class="form-control" rows="3" required>{{ issue.desc }}</textarea>
                    </div>
                    <div class="col-12">
                        <label class="form-label">改善 / 处理方法</label>
                        <textarea name="root_cause" class="form-control" rows="2">{{ issue.root_cause }}</textarea>
                    </div>
                </div>
            </div>
        </div>

        <div class="card mb-3">
            <div class="card-header fw-bold">导入相关（可选）</div>
            <div class="card-body">
                <div class="row g-3">
                    <div class="col-md-6">
                        <div class="form-check mb-2">
                            <input class="form-check-input" type="checkbox" name="can_import_maintenance" id="m1"
                                   {% if issue.can_import_maintenance %}checked{% endif %}>
                            <label class="form-check-label" for="m1">可导入保养</label>
                        </div>
                        <input type="text" name="maintenance_id" class="form-control" placeholder="保养ID"
                               value="{{ issue.maintenance_id }}">
                    </div>
                    <div class="col-md-6">
                        <div class="form-check mb-2">
                            <input class="form-check-input" type="checkbox" name="can_import_design" id="d1"
                                   {% if issue.can_import_design %}checked{% endif %}>
                            <label class="form-check-label" for="d1">可导入设计</label>
                        </div>
                        <input type="text" name="design_id" class="form-control" placeholder="设计ID"
                               value="{{ issue.design_id }}">
                    </div>
                    <div class="col-md-6">
                        <div class="form-check mb-2">
                            <input class="form-check-input" type="checkbox" name="can_import_training" id="t1"
                                   {% if issue.can_import_training %}checked{% endif %}>
                            <label class="form-check-label" for="t1">可导入培训</label>
                        </div>
                        <input type="text" name="training_id" class="form-control" placeholder="培训ID"
                               value="{{ issue.training_id }}">
                    </div>
                    <div class="col-md-6">
                        <div class="form-check mb-2">
                            <input class="form-check-input" type="checkbox" name="can_import_repair" id="r1"
                                   {% if issue.can_import_repair %}checked{% endif %}>
                            <label class="form-check-label" for="r1">可导入维修</label>
                        </div>
                        <input type="text" name="repair_id" class="form-control" placeholder="维修ID"
                               value="{{ issue.repair_id }}">
                    </div>
                </div>
            </div>
        </div>

        <div class="d-flex gap-2 mb-5">
            <button type="submit" class="btn btn-primary btn-lg">✅ 保存Lưu</button>
            <a href="{% url 'issues:issue_detail' issue.pk %}" class="btn btn-secondary btn-lg">取消</a>
        </div>
    </form>
</div>
{% endblock %}
